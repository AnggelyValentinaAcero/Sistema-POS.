<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOG</title>
    <link rel="stylesheet" href="../../componetes/modulos/autentificacion/log.css">
</head>
<body class="body">

    <main class="auth-card" id="auth-card">

        <!-- Panel azul con los botones para cambiar de formulario -->
        <aside class="auth-switch">
            <div class="switch-content" id="registro-invitacion">
                <h2>¿Aún no tienes una cuenta?</h2>
                <p>Regístrate para crear una cuenta.</p>
                <button id="mostrar-registro" type="button" class="fill-btn">
                    Registrarse
                </button>
            </div>

            <div class="switch-content" id="login-invitacion" hidden>
                <h2>¡Qué bueno verte de nuevo!</h2>
                <p>Si ya tienes una cuenta, inicia sesión.</p>
                <button id="mostrar-login" type="button" class="fill-btn">
                    Ya tengo una cuenta
                </button>
            </div>
        </aside>

        <!-- Panel que contiene los formularios -->
        <div class="auth-forms">

            <section class="auth-view" id="login-view">
                <form class="CENTRADO" id="login-form">
                    <h1 class="titulitulo">Iniciar sesión</h1>
                    <p id="login-message" class="auth-message" role="alert" aria-live="polite"></p>

                    <div class="field-group">
                        <label class="form-label" for="login-username">Usuario</label>
                        <input
                            class="form-input"
                            id="login-username"
                            name="username"
                            type="text"
                            placeholder="Usuario"
                            required
                        >
                    </div>

                    <div class="field-group">
                        <label class="form-label" for="login-password">Contraseña</label>
                        <input
                            class="form-input"
                            id="login-password"
                            name="password"
                            type="password"
                            placeholder="Contraseña"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <button id="login-button" type="submit" class="fill-btn">
                        Iniciar sesión
                    </button>
                </form>
            </section>

            <section class="auth-view" id="registro-view" hidden>
                <form class="CENTRADO" id="registrar-form">
                    <h1 class="titulitulo">Crear cuenta</h1>
                    <p id="registro-message" class="auth-message" role="alert" aria-live="polite"></p>

                    <div class="field-group">
                        <label class="form-label" for="registro-username">Usuario</label>
                        <input
                            class="form-input"
                            id="registro-username"
                            name="username"
                            type="text"
                            placeholder="Usuario"
                            required
                        >
                    </div>

                    <div class="field-group">
                        <label class="form-label" for="registro-password">Contraseña</label>
                        <input
                            class="form-input"
                            id="registro-password"
                            name="password"
                            type="password"
                            placeholder="Contraseña"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <div class="field-group">
                        <label class="form-label" for="confirm-password">
                            Confirmar contraseña
                        </label>
                        <input
                            class="form-input"
                            id="confirm-password"
                            name="confirm_password"
                            type="password"
                            placeholder="Confirmar contraseña"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <button id="registro-button" type="submit" class="fill-btn">
                        Crear cuenta
                    </button>
                </form>
            </section>

        </div>
    </main>

    <script src="../../services/modulos/autentificacion/log.js" defer></script>
</body>
</html>
